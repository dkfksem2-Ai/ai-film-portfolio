<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>틈GO · 현우의 원룸 야간 탐색</title>
<meta content="틈GO 가상 생활 서비스 광고의 주인공 현우의 원룸. 5개 구역을 둘러보고 문 앞 수거 대상 세탁물을 찾아보세요." name="description"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet"/>
<style>
    :root {
      --font-main: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --color-mint: #00ff66;
      --color-mint-dim: rgba(0, 255, 102, 0.18);
      --color-dark: #0a0e14;
      --color-card: rgba(14, 18, 26, 0.78);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--color-dark);
      color: #fff;
      font-family: var(--font-main);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* Top Minimal HUD */
    .hud {
      position: fixed;
      top: 24px;
      left: 28px;
      right: 28px;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .hud-left, .hud-right {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }
    .btn-chip {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(12, 16, 24, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(255, 255, 255, 0.92);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.015em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.22s var(--ease-out);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .btn-chip:hover {
      background: rgba(24, 30, 42, 0.9);
      border-color: rgba(255, 255, 255, 0.3);
      color: #fff;
      transform: translateY(-1px);
    }
    .btn-sound.is-muted {
      color: rgba(255, 255, 255, 0.45);
      border-color: rgba(255, 255, 255, 0.08);
    }

    /* Counter Pill */
    .counter-pill {
      background: rgba(10, 14, 22, 0.85);
      border: 1px solid rgba(0, 255, 102, 0.35);
      box-shadow: 0 0 20px -4px rgba(0, 255, 102, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      padding: 7px 16px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: transform 0.2s var(--ease-out);
    }
    .counter-pill.bump {
      transform: scale(1.1);
      border-color: var(--color-mint);
    }
    .bag-icon {
      color: var(--color-mint);
      display: flex;
      align-items: center;
    }
    .counter-label {
      color: rgba(255, 255, 255, 0.7);
      font-size: 12.5px;
    }
    .counter-val {
      color: #fff;
      font-variant-numeric: tabular-nums;
    }
    .counter-val strong {
      color: var(--color-mint);
      font-weight: 700;
    }

    /* Viewport Frame & Parallax Stage */
    .viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .view-layer {
      position: absolute;
      inset: -4%;
      width: 108%;
      height: 108%;
      opacity: 0;
      visibility: hidden;
      transform: scale(1.06) translate3d(calc(var(--px, 0) * -24px), calc(var(--py, 0) * -24px), 0);
      transition: opacity 0.65s var(--ease-out), transform 0.18s ease-out;
      will-change: transform, opacity;
    }
    .view-layer.is-active {
      opacity: 1;
      visibility: visible;
    }
    .view-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* Subtle Cinematic Vignette */
    .cinematic-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.58) 100%);
    }

    /* Directional Navigation Arrows (Opacity 0 -> 100% on move) */
    .nav-arrow {
      position: fixed;
      z-index: 40;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(10, 14, 22, 0.68);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: rgba(255, 255, 255, 0.95);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s var(--ease-out), transform 0.22s var(--ease-out), background 0.2s, border-color 0.2s;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    }
    .nav-arrow.is-visible {
      opacity: 0.85;
      pointer-events: auto;
    }
    .nav-arrow:hover {
      opacity: 1 !important;
      background: rgba(18, 24, 36, 0.92);
      border-color: var(--color-mint);
      color: var(--color-mint);
      transform: scale(1.08);
    }
    .nav-arrow--prev {
      left: 28px;
      top: 50%;
      transform: translateY(-50%);
    }
    .nav-arrow--prev:hover {
      transform: translateY(-50%) scale(1.08) translateX(-2px);
    }
    .nav-arrow--next {
      right: 28px;
      top: 50%;
      transform: translateY(-50%);
    }
    .nav-arrow--next:hover {
      transform: translateY(-50%) scale(1.08) translateX(2px);
    }

    /* Scene Indicator (Bottom Center Minimal Dots) */
    .scene-indicator {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(10, 14, 22, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }
    .scene-indicator.is-visible {
      opacity: 1;
      pointer-events: auto;
    }
    .dot-step {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .dot-step.is-on {
      width: 22px;
      border-radius: 999px;
      background: var(--color-mint);
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
    }

    /* Interactive Hidden Object Hotspots */
    .hotspot {
      position: absolute;
      border-radius: 12px;
      cursor: pointer;
      pointer-events: auto;
      transition: opacity 0.3s ease, transform 0.5s var(--ease-out);
    }
    .hotspot::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: inherit;
      border: 1.5px dashed rgba(0, 255, 102, 0);
      background: rgba(0, 255, 102, 0);
      transition: all 0.28s var(--ease-out);
      pointer-events: none;
    }
    .hotspot:hover::before {
      border-color: rgba(0, 255, 102, 0.85);
      background: rgba(0, 255, 102, 0.12);
      box-shadow: 0 0 24px rgba(0, 255, 102, 0.35), inset 0 0 12px rgba(0, 255, 102, 0.2);
    }

    /* 4-Second Auto-Hint Pulse */
    .hotspot.is-hint::before {
      border-color: rgba(0, 255, 102, 0.95);
      background: rgba(0, 255, 102, 0.18);
      box-shadow: 0 0 32px rgba(0, 255, 102, 0.6), inset 0 0 16px rgba(0, 255, 102, 0.3);
      animation: hintPulse 1.6s infinite ease-in-out;
    }
    .hotspot.is-hint .hotspot-tooltip {
      opacity: 0.95;
      transform: translateX(-50%) translateY(0);
      border-color: var(--color-mint);
      box-shadow: 0 0 18px rgba(0, 255, 102, 0.45);
    }
    @keyframes hintPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 18px rgba(0, 255, 102, 0.4);
      }
      50% {
        transform: scale(1.07);
        box-shadow: 0 0 38px rgba(0, 255, 102, 0.8), inset 0 0 20px rgba(0, 255, 102, 0.45);
      }
    }

    /* Tooltip */
    .hotspot-tooltip {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      background: rgba(10, 14, 22, 0.92);
      border: 1px solid rgba(0, 255, 102, 0.4);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: #fff;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.2s var(--ease-out);
    }
    .hotspot-tooltip strong {
      color: var(--color-mint);
      margin-right: 4px;
    }
    .hotspot:hover .hotspot-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .hotspot.is-collected {
      display: none !important;
    }

    /* Toast Notification Pill */
    .toast-pill {
      position: fixed;
      top: 86px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      opacity: 0;
      pointer-events: none;
      z-index: 60;
      background: rgba(12, 18, 28, 0.92);
      border: 1px solid rgba(0, 255, 102, 0.5);
      color: #fff;
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.015em;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 255, 102, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.3s var(--ease-out);
    }
    .toast-pill.is-show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Fly Clone Particle */
    .fly-particle {
      position: fixed;
      z-index: 999;
      pointer-events: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--color-mint);
      box-shadow: 0 0 30px var(--color-mint);
      transition: all 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* View 5 Completion Screen Overlay */
    .done-modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8, 12, 18, 0.68);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s var(--ease-out);
    }
    .done-modal.is-active {
      opacity: 1;
      pointer-events: auto;
    }
    .done-card {
      position: relative;
      overflow: hidden;
      max-width: 480px;
      width: calc(100% - 48px);
      background: rgba(14, 18, 26, 0.94);
      border: 1.5px solid rgba(0, 255, 102, 0.45);
      box-shadow: 0 24px 60px -10px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 255, 102, 0.3);
      border-radius: 18px;
      padding: 42px 36px;
      text-align: center;
      display: grid;
      gap: 22px;
      transform: translateY(20px) scale(0.96);
      transition: transform 0.5s var(--ease-out);
    }
    .done-modal.is-active .done-card {
      transform: translateY(0) scale(1);
    }
    /* Futuristic Left-to-Right Laser Scan Beam */
    .scan-laser-beam {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, transparent, #00ff66 20%, #ffffff 50%, #00ff66 80%, transparent);
      box-shadow: 0 0 25px 8px rgba(0, 255, 102, 0.85);
      pointer-events: none;
      opacity: 0;
    }
    .done-modal.is-active .scan-laser-beam {
      opacity: 1;
      animation: scanLaserSweep 2.2s infinite ease-in-out;
    }
    @keyframes scanLaserSweep {
      0% { left: -8%; }
      50% { left: 108%; }
      100% { left: -8%; }
    }
    .done-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--color-mint);
      background: rgba(0, 255, 102, 0.1);
      border: 1px solid rgba(0, 255, 102, 0.3);
      padding: 5px 12px;
      border-radius: 999px;
      margin: 0 auto;
    }
    .done-title {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .done-quote {
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.78);
      letter-spacing: -0.015em;
    }
    .done-quote em {
      font-style: normal;
      color: var(--color-mint);
      font-weight: 600;
    }
    .done-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }
    .btn-return {
      appearance: none;
      border: 0;
      background: var(--color-mint);
      color: #06180e;
      font-family: inherit;
      font-size: 17.5px;
      font-weight: 700;
      letter-spacing: -0.015em;
      padding: 16px 28px;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 255, 102, 0.4);
      transition: all 0.2s var(--ease-out);
    }
    .btn-return:hover {
      background: #33ff85;
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0, 255, 102, 0.55);
    }
    .btn-replay {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.9);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 13px 22px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-replay:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.4);
    }
  </style>
<style>
/* V9.5: targets use the actual, uncropped image rectangle. */
.viewport{inset:90px 24px 94px;width:auto;height:auto;}
.view-layer{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);transition:opacity .4s ease;will-change:opacity;}
.view-layer img{object-fit:contain;}
.hotspot{transform:translate(-50%,-50%);min-width:44px;min-height:44px;}
.hotspot:focus-visible{outline:3px solid #00ff66;outline-offset:3px;}
.hotspot:focus-visible .hotspot-tooltip{opacity:1;transform:translateX(-50%);}
.hotspot-tooltip{white-space:normal;width:max-content;max-width:min(220px,65vw);text-align:center;}
.target-left .hotspot-tooltip{left:0;transform:translateY(0)!important;}
.target-right .hotspot-tooltip{left:auto;right:0;transform:translateY(0)!important;}
.nav-arrow{pointer-events:auto!important;opacity:1!important;bottom:20px;top:auto;transform:none;width:48px;height:48px;}
.nav-arrow--prev{left:24px;}.nav-arrow--next{right:24px;}
.scene-indicator{opacity:1!important;pointer-events:auto!important;bottom:34px;}
.dot-step{border:0;padding:0;min-width:16px;min-height:16px;cursor:pointer;}
.done-modal:not(.is-active){visibility:hidden;}.done-card{max-height:90svh;overflow:auto;}
@media(max-width:600px){.hud{top:16px;left:12px;right:12px;gap:8px;flex-wrap:wrap;}.hud-left{gap:6px;}.btn-chip{padding:8px 10px;}.counter-label{display:none;}.counter-pill{padding:8px 10px;}.viewport{inset:92px 12px 90px;}.done-card{padding:24px;}.done-title{font-size:23px;}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}
</style></head>
<body>
<!-- Minimal HUD Header -->
<header class="hud">
<div class="hud-left">
<a aria-label="메인 포트폴리오로 돌아가기" class="btn-chip" href="index.html#tumgo">
<svg fill="none" height="14" viewbox="0 0 16 16" width="14"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<span>나가기</span>
</a>
<button aria-label="배경음악 켜기/끄기" aria-pressed="false" class="btn-chip btn-sound" id="btn-sound" type="button">
<svg fill="currentColor" height="14" viewbox="0 0 16 16" width="14"><path d="M8 2.5 4.5 5.5H2v5h2.5L8 13.5V2.5zm3.5 3a4 4 0 0 1 0 5M13 3.5a7 7 0 0 1 0 9"></path></svg>
<span id="sound-label">BGM OFF</span>
</button>
</div>
<div class="hud-right">
<div class="counter-pill" id="counter-pill">
<span class="bag-icon">
<svg fill="currentColor" height="17" viewbox="0 0 24 24" width="17"><path d="M19 6h-3V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-9-2h4v2h-4V4zm9 16H5V8h14v12z"></path></svg>
</span>
<span class="counter-label">수거 품목</span>
<span class="counter-val"><strong id="count-current">0</strong> / 5</span>
</div>
</div>
</header>
<!-- Toast Notification -->
<div aria-live="polite" class="toast-pill" id="toast-pill"></div>
<!-- Parallax Viewport Stage (5 TUMGO Exclusive Views) -->
<main class="viewport" id="viewport">
<!-- View 1: 원룸 침대 & 전경 (doc image2 기반 고각도 원룸) -->
<div class="view-layer is-active" data-view="0" id="view-0">
<img alt="현우의 원룸 전경 고각도 오버뷰" src="assets/room-view-1.webp"/>
<!-- Item 1: 바닥에 널브러진 촬영 의류 더미 -->
<div aria-label="바닥에 쌓인 세탁물 수거하기" class="hotspot" data-item="pile" role="button" style="left:68%;top:64%;width:13%;height:13%;" tabindex="0">
<div class="hotspot-tooltip"><strong>[수거]</strong> 바닥에 쌓인 세탁물</div>
</div>
</div>
<!-- View 2: 심야 00:35 침대 앞 빨래 바구니 (doc image5) -->
<div class="view-layer" data-view="1" id="view-1">
<img alt="심야 00:35 침대 앞 빨래 바구니를 바라보는 현우" src="assets/room-view-2.webp"/>
<!-- Item 2: 심야 소음으로 못 돌린 빨랫감 -->
<div aria-label="세탁기 옆 빨래 바구니 수거하기" class="hotspot" data-item="basket" role="button" style="left:74.5%;top:67%;width:10%;height:17%;" tabindex="0">
<div class="hotspot-tooltip"><strong>[수거]</strong> 세탁기 옆 빨래 바구니</div>
</div>
</div>
<!-- View 3: 노트북 작업 데스크 (doc image6) -->
<div class="view-layer" data-view="2" id="view-2">
<img alt="노트북 작업 데스크와 커피 쏟은 셔츠" src="assets/room-view-3.webp"/>
<!-- Item 3: 커피 얼룩진 작업 셔츠 -->
<div aria-label="커피 얼룩이 묻은 흰 셔츠 수거하기" class="hotspot" data-item="coffee" role="button" style="left:54%;top:78%;width:19%;height:20%;" tabindex="0">
<div class="hotspot-tooltip"><strong>[수거]</strong> 커피 얼룩이 묻은 흰 셔츠</div>
</div>
<!-- Item 4: 단추·실밥 풀린 수선 청바지 -->

</div>
<!-- View 4: 원룸 세탁 구역 & 밀린 세탁물 -->
<div class="view-layer" data-view="3" id="view-3">
<img alt="수거 가방과 찢어진 청바지, 테이블 위 회색 세탁물" src="assets/room-view-4.webp"/>
<!-- Item 5: 땀에 젖은 스태프 후드집업 -->
<div aria-label="테이블 위 회색 세탁물 수거하기" class="hotspot target-left" data-item="hoodie" role="button" style="left:12%;top:86%;width:16%;height:18%;" tabindex="0">
<div class="hotspot-tooltip"><strong>[수거]</strong> 테이블 위 회색 세탁물</div>
</div>
<div aria-label="무릎이 찢어진 수선 청바지 수거하기" class="hotspot" data-item="pants" role="button" style="left:45.5%;top:51%;width:10%;height:19%;" tabindex="0">
<div class="hotspot-tooltip"><strong>[수거]</strong> 무릎이 찢어진 수선 청바지</div>
</div></div>
<!-- View 5: 101호 문 앞 로봇 수거 최종 클라이맥스 장면 -->
<div class="view-layer" data-view="4" id="view-4">
<img alt="전용 가방을 들고 문을 나서는 현우" src="assets/room-view-5.webp"/>
</div>
</main>
<div aria-hidden="true" class="cinematic-vignette"></div>
<!-- Edge Fade Directional Navigation Arrows -->
<button aria-label="이전 방 각도 보기" class="nav-arrow nav-arrow--prev" id="nav-prev" type="button">
<svg fill="none" height="24" viewbox="0 0 24 24" width="24"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path></svg>
</button>
<button aria-label="다음 방 각도 보기" class="nav-arrow nav-arrow--next" id="nav-next" type="button">
<svg fill="none" height="24" viewbox="0 0 24 24" width="24"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path></svg>
</button>
<!-- Bottom Scene Indicator Dots -->
<nav aria-label="탐색 장면 선택" class="scene-indicator" id="scene-indicator">
<button aria-label="원룸 전경" class="dot-step is-on" data-target="0" title="원룸 전경" type="button"></button>
<button aria-label="세탁기 옆 바구니" class="dot-step" data-target="1" title="세탁기 옆 바구니" type="button"></button>
<button aria-label="커피 얼룩 셔츠" class="dot-step" data-target="2" title="커피 얼룩 셔츠" type="button"></button>
<button aria-label="수선·세탁물 준비" class="dot-step" data-target="3" title="수선·세탁물 준비" type="button"></button>
<button aria-label="문 앞 가방" class="dot-step" data-target="4" title="문 앞 가방" type="button"></button>
</nav>
<!-- View 5 Completion Modal Overlay -->
<section aria-labelledby="done-title" aria-modal="true" class="done-modal" id="done-modal" role="dialog">
<div class="done-card">
<div aria-hidden="true" class="scan-laser-beam"></div>
<span class="done-badge">TUMGO · 수거 완료</span>
<h2 class="done-title" id="done-title">문 앞 수거 접수 완료</h2>
<p class="done-quote">세탁물 4건과 수선 1건을 모두 골랐습니다. 문 앞에 맡기면 다음은 틈GO가.</p>
<div class="done-actions">
<a class="btn-return" href="index.html#tumgo">포트폴리오로 돌아가기</a>
<button class="btn-replay" id="btn-replay" type="button">방 다시 둘러보기</button>
</div>
</div>
</section>
<!-- Background Music Audio Element -->
<audio id="room-bgm" loop="" preload="auto" src="assets/audio/room-bgm.mp3"></audio>
<script>
  (() => {
    'use strict';
    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];

    // State
    let currentView = 0;
    const totalViews = 5;
    function fitViews(){
      const stage=$('#viewport');
      viewLayers.forEach(layer=>{const img=layer.querySelector('img');if(!img.naturalWidth)return;const scale=Math.min(stage.clientWidth/img.naturalWidth,stage.clientHeight/img.naturalHeight);layer.style.width=(img.naturalWidth*scale)+'px';layer.style.height=(img.naturalHeight*scale)+'px';});
    }
    let collectedCount = 0;
    const collectedItems = new Set();
    let isFinished = false;

    // Elements
    const viewLayers = $$('.view-layer');
    viewLayers.forEach(layer=>layer.querySelector('img').addEventListener('load',fitViews));
    window.addEventListener('resize',fitViews);
    requestAnimationFrame(fitViews);
    const dotSteps = $$('.dot-step');
    const navPrev = $('#nav-prev');
    const navNext = $('#nav-next');
    const sceneIndicator = $('#scene-indicator');
    const counterPill = $('#counter-pill');
    const countCurrent = $('#count-current');
    const toastPill = $('#toast-pill');
    const doneModal = $('#done-modal');
    const btnReplay = $('#btn-replay');
    const btnSound = $('#btn-sound');
    const soundLabel = $('#sound-label');
    const audioBgm = $('#room-bgm');

    // Web Audio Synthesizer (Crisp chime & collection sounds & cybernetic scan SFX)
    let audioCtx = null;
    function playChime(freqs = [520, 780, 1040]) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        freqs.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + i * 0.08);
          gain.gain.setValueAtTime(0.12, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.28);
        });
      } catch (e) {}
    }

    // High-tech Cybernetic Scan Sound Effect
    function playScanSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(600, now);
        filter.frequency.exponentialRampToValueAtTime(3600, now + 0.55);
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(1500, now + 0.55);
        
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.65);
        
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(now);
        osc.stop(now + 0.7);
      } catch (e) {}
    }

    // 4-Second Auto-Hint Timer (Relieves user frustration per doc v9.1 item 4)
    let hintTimer = null;
    function scheduleHint() {
      clearTimeout(hintTimer);
      $$('.hotspot.is-hint').forEach(el => el.classList.remove('is-hint'));
      const activeLayer = viewLayers[currentView];
      if (!activeLayer) return;
      const remaining = activeLayer.querySelectorAll('.hotspot:not(.is-collected)');
      if (remaining.length === 0) return;
      hintTimer = setTimeout(() => {
        remaining.forEach(spot => spot.classList.add('is-hint'));
      }, 4000);
    }

    // View Switching
    function setView(idx) {
      if (isFinished || idx < 0 || idx >= totalViews) return;
      currentView = idx;
      viewLayers.forEach((layer, i) => {
        layer.classList.toggle('is-active', i === currentView);
      });
      dotSteps.forEach((dot, i) => {
        dot.classList.toggle('is-on', i === currentView);
      });
      scheduleHint();
    }

    navPrev.addEventListener('click', () => {
      playChime([440, 550]);
      setView((currentView - 1 + 4) % 4);
    });
    navNext.addEventListener('click', () => {
      playChime([550, 660]);
      setView((currentView + 1) % 4);
    });
    dotSteps.forEach(dot => {
      dot.addEventListener('click', () => {
        const t = Number(dot.dataset.target);
        playChime([600]);
        setView(t);
      });
    });

    // Arrow Visibility & Mouse Edge Proximity (0 -> 100% Opacity)
    let hideTimer = null;
    function showNavs() {
      if (currentView < 4) {
        navPrev.classList.add('is-visible');
        navNext.classList.add('is-visible');
        sceneIndicator.classList.add('is-visible');
      }
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        navPrev.classList.remove('is-visible');
        navNext.classList.remove('is-visible');
        sceneIndicator.classList.remove('is-visible');
      }, 2200);
    }

    // Parallax on Mouse Cursor Movement
    window.addEventListener('pointermove', (e) => {
      showNavs();
      const normX = (e.clientX / window.innerWidth) - 0.5;
      const normY = (e.clientY / window.innerHeight) - 0.5;
      document.documentElement.style.setProperty('--px', normX.toFixed(3));
      document.documentElement.style.setProperty('--py', normY.toFixed(3));
    }, { passive: true });

    // Toast pill helper
    let toastTimer = null;
    function showToast(msg) {
      toastPill.textContent = msg;
      toastPill.classList.add('is-show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastPill.classList.remove('is-show'), 2000);
    }

    // Hotspot Collection Click
    $$('.hotspot').forEach(spot => {
      const handleCollect = (e) => {
        e.stopPropagation();
        const itemId = spot.dataset.item;
        if (collectedItems.has(itemId)) return;

        collectedItems.add(itemId);
        collectedCount++;
        countCurrent.textContent = String(collectedCount);

        // Sound chime
        playChime([580, 880, 1160]);

        // Fly animation toward counter
        const rect = spot.getBoundingClientRect();
        const destRect = counterPill.getBoundingClientRect();
        const particle = document.createElement('div');
        particle.className = 'fly-particle';
        particle.style.left = `${rect.left + rect.width / 2 - 24}px`;
        particle.style.top = `${rect.top + rect.height / 2 - 24}px`;
        document.body.appendChild(particle);

        requestAnimationFrame(() => {
          particle.style.left = `${destRect.left + destRect.width / 2 - 12}px`;
          particle.style.top = `${destRect.top + destRect.height / 2 - 12}px`;
          particle.style.transform = 'scale(0.2)';
          particle.style.opacity = '0.3';
        });

        setTimeout(() => {
          particle.remove();
          counterPill.classList.remove('bump');
          void counterPill.offsetWidth;
          counterPill.classList.add('bump');
        }, 620);

        spot.classList.add('is-collected');spot.tabIndex=-1;
        const tooltipText = spot.querySelector('.hotspot-tooltip')?.textContent?.replace('[수거]', '').trim() || '세탁물';
        showToast(`✓ ${tooltipText} 수거 가방에 담김`);

        // Check 5/5 complete
        if (collectedCount >= 5 && !isFinished) {
          isFinished = true;
          clearTimeout(hintTimer);
          setTimeout(() => {
            playChime([520, 650, 780, 1040]);
            isFinished = false; setView(4); isFinished = true; // 완료 장면으로 전환
            navPrev.classList.remove('is-visible');
            navNext.classList.remove('is-visible');
            setTimeout(() => {
              playScanSound();
              doneModal.classList.add('is-active');btnReplay.focus();
            }, 600);
          }, 1100);
        } else {
          scheduleHint();
        }
      };

      spot.addEventListener('click', handleCollect);
      spot.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          handleCollect(e);
        }
      });
    });

    // Replay Button
    btnReplay.addEventListener('click', () => {
      doneModal.classList.remove('is-active');
      collectedItems.clear();
      collectedCount = 0;
      countCurrent.textContent = '0';
      isFinished = false;
      $$('.hotspot').forEach(spot => {
        spot.classList.remove('is-collected');spot.tabIndex=0;
        spot.classList.remove('is-hint');
      });
      setView(0);
      navNext.focus();
      showToast('원룸이 재설정되었습니다. 다시 둘러보세요.');
      scheduleHint();
    });

    // Background Audio Handler
    let isSoundOn = false;
    function toggleSound() {
      isSoundOn = !isSoundOn;
      btnSound.classList.toggle('is-muted', !isSoundOn);
      btnSound.setAttribute('aria-pressed', String(isSoundOn));
      soundLabel.textContent = isSoundOn ? 'BGM ON' : 'BGM OFF';
      if (audioBgm) {
        if (isSoundOn) {
          audioBgm.volume = 0.45;
          audioBgm.play().catch(() => {});
        } else {
          audioBgm.pause();
        }
      }
    }
    btnSound.addEventListener('click', toggleSound);

    // Initial audio start on user first gesture
    const startAudioOnce = () => {
      if (isSoundOn && audioBgm && audioBgm.paused) {
        audioBgm.volume = 0.45;
        audioBgm.play().catch(() => {});
      }
      window.removeEventListener('pointerdown', startAudioOnce);
    };
    window.addEventListener('pointerdown', startAudioOnce);

    // Initial show nav arrows for hint & schedule auto-hint
    showNavs();
    scheduleHint();
  })();
  </script>
</body>
</html>
