<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<script>try{if(sessionStorage.getItem("pf-curtain-in")==="1")document.documentElement.classList.add("pf-cover")}catch(e){}</script>

<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>팀 프로젝트 — JEONG JAEHWAN AI Film Portfolio</title>
<meta name="description" content="정재환이 팀으로 참여한 AI 광고 작업입니다."/>
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=933"/>
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=933"/>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=933"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&amp;family=Hahmlet:wght@700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet"/>
<style>
:root {
  --paper: #f1ece3; --paper-2: #e8e1d4; --ink: #1e1c19; --ink-2: #1e1c19a6; --ink-3: #1e1c1959;
  --rule: #1e1c1926; --brown: #5a3416; --empty: #1e1c1966;
  --sans: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
  --serif: "Gowun Batang", serif; --head: "Hahmlet", "Gowun Batang", serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.7 var(--sans); letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
img { display: block; max-width: 100%; }
.wrap { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }

/* 위 막대 */
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in oklab, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.top .wrap { display: flex; justify-content: space-between; align-items: center; height: 60px; gap: 16px; }
.top a { text-decoration: none; font: 400 15px/1 var(--serif); }
.top a:hover { text-decoration: underline; text-underline-offset: 5px; }
.top .name { letter-spacing: .06em; }

/* 머리 */
.head { padding: clamp(56px, 10vh, 120px) 0 clamp(28px, 5vh, 56px); }
.badge { display: inline-block; font: 500 14px/1 var(--sans); padding: 8px 12px; border: 1px solid var(--ink-3); margin: 0 0 22px; }
.title { margin: 0; font: 900 clamp(48px, 7.4vw, 132px)/1.02 var(--head); letter-spacing: -.05em; }
.logline { margin: 18px 0 0; max-width: 34em; font: 400 clamp(18px, 1.5vw, 24px)/1.55 var(--serif); color: var(--ink-2); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0; margin: clamp(32px, 5vh, 56px) 0 0; border-top: 1px solid var(--rule); }
.facts div { padding: 16px 16px 16px 0; border-bottom: 1px solid var(--rule); }
.facts dt { font-size: 13px; color: var(--ink-2); }
.facts dd { margin: 4px 0 0; font-size: 17px; font-weight: 500; }

/* 영상 */
.video { position: relative; aspect-ratio: 16 / 9; background: #14130f; overflow: hidden; }
.video iframe, .video video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; color: #f1ece3;
  background: radial-gradient(70% 80% at 50% 45%, #2a2620 0%, #14130f 75%); }
.video-empty b { font: 700 clamp(20px, 2vw, 30px)/1.3 var(--serif); }
.video-empty span { font-size: 14px; color: #f1ece399; }

/* 구간 */
.sec { display: grid; grid-template-columns: minmax(160px, 260px) 1fr; gap: clamp(20px, 4vw, 64px); padding: clamp(48px, 8vh, 96px) 0; border-top: 1px solid var(--rule); }
.sec h2 { margin: 0; font: 700 clamp(22px, 1.8vw, 30px)/1.25 var(--serif); letter-spacing: -.03em; }
.sec .body > p { margin: 0; max-width: 38em; white-space: pre-line; }
.empty { color: var(--empty); font-style: normal; }
.empty::before { content: ""; display: inline-block; width: 18px; height: 1px; background: currentColor; vertical-align: middle; margin-right: 10px; }

.people { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.people li { padding: 14px 16px; border: 1px solid var(--rule); background: #ffffff55; }
.people li.me { border-color: var(--brown); background: #5a34160d; }
.people b { display: block; font-weight: 600; }
.people small { font-size: 14px; color: var(--ink-2); }
.people .tag { font-size: 12px; color: var(--brown); margin-left: 6px; font-weight: 600; }
.mine { margin: 28px 0 0; padding: 0; list-style: none; }
.mine li { padding: 10px 0 10px 26px; border-bottom: 1px solid var(--rule); position: relative; }
.mine li.none { padding-left: 0; }
.mine li.none::before { display: none; }
.mine li::before { content: ""; position: absolute; left: 0; top: 1.15em; width: 12px; height: 2px; background: var(--brown); }
.sub { margin: 32px 0 6px; font: 600 15px/1.4 var(--sans); }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: clamp(28px, 4vh, 44px); counter-reset: s; }
.steps li { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px, 2.4vw, 36px); align-items: start; counter-increment: s; }
.steps li.noimg { grid-template-columns: 1fr; }
.steps h3 { margin: 0 0 8px; font: 700 20px/1.35 var(--sans); }
.steps h3::before { content: counter(s) ". "; color: var(--brown); }
.steps p { margin: 0; white-space: pre-line; color: var(--ink-2); }
.steps img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: var(--paper-2); }

.stills { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.stills figure { margin: 0; }
.stills img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--paper-2); }
.stills figcaption { margin-top: 8px; font-size: 14px; color: var(--ink-2); }

.tools { margin: 0; display: grid; grid-template-columns: max-content 1fr; }
.tools dt, .tools dd { margin: 0; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.tools dt { padding-right: 32px; color: var(--ink-2); font-size: 15px; }

/* 장막: 포트폴리오에서 넘어올 때 왼쪽→오른쪽으로 걷힌다 */
html.pf-cover::after { content: ""; position: fixed; inset: 0; z-index: 9999; background: #0b0d10; }
.pf-curtain { position: fixed; inset: 0; z-index: 9998; pointer-events: none; background: #0b0d10; transform: scaleX(0); transform-origin: left center; }
.pf-curtain.is-in { pointer-events: all; transition: transform .5s cubic-bezier(.7, 0, .3, 1); transform: scaleX(1); }
.pf-curtain.is-out { transform-origin: right center; transition: transform .5s cubic-bezier(.7, 0, .3, 1); transform: scaleX(0); }
.pf-curtain::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 2px; background: #22c55e; box-shadow: 0 0 18px #22c55e; opacity: .8; }

/* 아래 */
.foot { border-top: 1px solid var(--rule); padding: 32px 0 48px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
.foot a { font-family: var(--serif); font-size: 16px; color: var(--ink); }

@media (max-width: 760px) {
  body { font-size: 16px; }
  .sec { grid-template-columns: 1fr; gap: 16px; }
  .steps li { grid-template-columns: 1fr; }
  .tools dt { padding-right: 18px; }
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="name pf-back" href="index.html">정재환</a>
  <a class="pf-back" href="index.html">← 포트폴리오로 돌아가기</a>
</div></header>

<main class="wrap">
  <section class="head">
    <p class="badge">팀 프로젝트</p>
    <h1 class="title" id="t-title">작품 제목</h1>
    <p class="logline" id="t-logline"></p>
    <dl class="facts" id="t-facts"></dl>
  </section>

  <section aria-label="광고 영상">
    <div class="video" id="t-video"></div>
  </section>

  <section class="sec" aria-labelledby="h-team">
    <h2 id="h-team">팀과 내가 맡은 일</h2>
    <div class="body">
      <ul class="people" id="t-team"></ul>
      <p class="sub">내가 한 일</p>
      <ul class="mine" id="t-mine"></ul>
    </div>
  </section>

  <section class="sec" aria-labelledby="h-intent">
    <h2 id="h-intent">기획 의도</h2>
    <div class="body"><p id="t-intent"></p></div>
  </section>

  <section class="sec" aria-labelledby="h-process">
    <h2 id="h-process">만든 과정</h2>
    <div class="body"><ol class="steps" id="t-process"></ol></div>
  </section>

  <section class="sec" aria-labelledby="h-stills">
    <h2 id="h-stills">장면</h2>
    <div class="body"><div class="stills" id="t-stills"></div></div>
  </section>

  <section class="sec" aria-labelledby="h-tools">
    <h2 id="h-tools">쓴 도구</h2>
    <div class="body"><dl class="tools" id="t-tools"></dl></div>
  </section>

  <section class="sec" aria-labelledby="h-review">
    <h2 id="h-review">돌아보며</h2>
    <div class="body"><p id="t-review"></p></div>
  </section>

  <footer class="foot">
    <span>수업 과제로 만든 팀 작업입니다.</span>
    <a class="pf-back" href="index.html">← 포트폴리오로 돌아가기</a>
  </footer>
</main>

<script src="team-data.js"></script>
<script>
/* 장막 전환: 들어올 때 걷고, 돌아갈 때 덮은 뒤 포트폴리오의 누른 자리로 */
(()=>{
 const reduce=matchMedia('(prefers-reduced-motion: reduce)');
 const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
 const c=document.createElement('div');c.className='pf-curtain';c.setAttribute('aria-hidden','true');document.body.append(c);
 function reveal(){
  document.documentElement.classList.remove('pf-cover');if(reduce.matches){c.className='pf-curtain';return}
  c.style.transition='none';c.className='pf-curtain is-in';void c.offsetWidth;c.style.transition='';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{c.classList.remove('is-in');c.classList.add('is-out');setTimeout(()=>c.classList.remove('is-out'),560)}));
 }
 if(ss.get('pf-curtain-in')==='1'){ss.del('pf-curtain-in');reveal()}
 addEventListener('pageshow',e=>{if(e.persisted&&c.classList.contains('is-in'))reveal()});
 document.addEventListener('click',e=>{
  const a=e.target.closest('a.pf-back');if(!a||e.ctrlKey||e.metaKey||e.shiftKey||e.button!==0)return;
  e.preventDefault();
  const fromSite=!!ss.get('pf-team');
  ss.set('pf-curtain-in','1');
  const go=()=>{if(fromSite&&history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin)history.back();else location.href='index.html'};
  if(reduce.matches){go();return}
  c.classList.remove('is-out');void c.offsetWidth;c.classList.add('is-in');setTimeout(go,520);
 });
})();
</script>
<script>
(()=>{
 'use strict';
 const D=window.TEAM||{},$=id=>document.getElementById(id);
 const has=v=>Array.isArray(v)?v.length>0:!!(v&&String(v).trim());
 const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const EMPTY='<span class="empty">준비 중</span>';

 // 머리
 if(has(D.title)){$('t-title').textContent=D.title;document.title=D.title+' — 팀 프로젝트 · 정재환'}
 else $('t-title').innerHTML='제목 <span style="color:var(--empty)">준비 중</span>';
 $('t-logline').innerHTML=has(D.logline)?esc(D.logline):EMPTY;
 $('t-facts').innerHTML=[['무엇',D.kind],['길이',D.runtime],['컷',D.cuts],['기간',D.period],['과제',D.course]]
  .map(([k,v])=>`<div><dt>${k}</dt><dd>${has(v)?esc(v):EMPTY}</dd></div>`).join('');

 // 영상
 const V=D.video||{},box=$('t-video');
 const ytId=s=>{s=String(s).trim();const m=s.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{6,})/);return m?m[1]:(/^[\w-]{6,}$/.test(s)?s:'')};
 if(has(V.youtube)&&ytId(V.youtube)){
  box.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${ytId(V.youtube)}?rel=0" title="${esc(D.title||'팀 프로젝트')} 광고 영상" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>`;
 }else if(has(V.mp4)){
  box.innerHTML=`<video controls playsinline preload="metadata" src="${esc(V.mp4)}"${has(V.poster)?` poster="${esc(V.poster)}"`:''}></video>`;
 }else{
  box.innerHTML='<div class="video-empty"><b>영상은 준비 중입니다.</b><span>완성되면 이 자리에서 바로 재생됩니다.</span></div>';
 }

 // 팀
 $('t-team').innerHTML=has(D.team)?D.team.map(p=>`<li${p.me?' class="me"':''}><b>${esc(p.name||'')}${p.me?'<span class="tag">나</span>':''}</b><small>${has(p.role)?esc(p.role):'맡은 일 준비 중'}</small></li>`).join(''):`<li>${EMPTY}</li>`;
 $('t-mine').innerHTML=has(D.myRole)?D.myRole.map(s=>`<li>${esc(s)}</li>`).join(''):`<li class="none">${EMPTY}</li>`;

 // 글
 $('t-intent').innerHTML=has(D.intent)?esc(D.intent):EMPTY;
 $('t-review').innerHTML=has(D.review)?esc(D.review):EMPTY;

 // 과정
 $('t-process').innerHTML=has(D.process)?D.process.map(s=>`<li${has(s.img)?'':' class="noimg"'}><div><h3>${esc(s.title||'')}</h3><p>${esc(s.text||'')}</p></div>${has(s.img)?`<img src="${esc(s.img)}" alt="${esc(s.title||'')}" loading="lazy"/>`:''}</li>`).join(''):`<li class="noimg"><p>${EMPTY}</p></li>`;
 $('t-process').style.counterReset=has(D.process)?'s':'';
 if(!has(D.process))$('t-process').firstElementChild.style.counterIncrement='none';

 // 장면
 $('t-stills').innerHTML=has(D.stills)?D.stills.map(s=>`<figure><img src="${esc(s.img)}" alt="${esc(s.caption||'')}" loading="lazy"/>${has(s.caption)?`<figcaption>${esc(s.caption)}</figcaption>`:''}</figure>`).join(''):`<p>${EMPTY}</p>`;

 // 도구
 $('t-tools').innerHTML=has(D.tools)?D.tools.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join(''):`<dt>${EMPTY}</dt><dd></dd>`;
})();
</script>
</body>
</html>
